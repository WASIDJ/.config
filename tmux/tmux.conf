# Prefix + t 设置别名；Prefix + T 清除别名
bind t command-prompt -p 'pane alias:' {
    set-option -p @pane_name '%%'
}
bind T set-option -pu @pane_name

# 树状选择器显示 pane 别名
bind w choose-tree -Z -F '#{?pane_id,#{pane_index} · #{?@pane_name,#{@pane_name},#{pane_current_command}},#{?window_id,#{window_name},#{session_name}}}'

# 与现有从 0 开始的窗口编号保持一致
bind 0 select-window -t :0

# Prefix + q 显示 pane 编号，3 秒内按数字跳转（数字单独用于 window）。
set -g display-panes-time 3000
bind q display-panes

# Alt + 数字：直接选择当前 window 的 pane，无需 Prefix。
bind -n M-0 select-pane -t :.0
bind -n M-1 select-pane -t :.1
bind -n M-2 select-pane -t :.2
bind -n M-3 select-pane -t :.3
bind -n M-4 select-pane -t :.4
bind -n M-5 select-pane -t :.5
bind -n M-6 select-pane -t :.6
bind -n M-7 select-pane -t :.7
bind -n M-8 select-pane -t :.8
bind -n M-9 select-pane -t :.9
