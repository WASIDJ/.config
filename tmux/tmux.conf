set -g pane-active-border-style 'fg=#{?#{==:#{pane_index},0},#89dceb,#{?#{==:#{pane_index},1},#a6e3a1,#{?#{==:#{pane_index},2},#fab387,#{?#{==:#{pane_index},3},#cba6f7,#{?#{==:#{pane_index},4},#f38ba8,#{?#{==:#{pane_index},5},#f9e2af,#{?#{==:#{pane_index},6},#89b4fa,#{?#{==:#{pane_index},7},#f5c2e7,#{?#{==:#{pane_index},8},#89dceb,#{?#{==:#{pane_index},9},#a6e3a1,#{?#{==:#{pane_index},10},#fab387,#{?#{==:#{pane_index},11},#cba6f7,#{?#{==:#{pane_index},12},#f38ba8,#{?#{==:#{pane_index},13},#f9e2af,#{?#{==:#{pane_index},14},#89b4fa,#{?#{==:#{pane_index},15},#f5c2e7,#{?#{==:#{pane_index},16},#89dceb,#{?#{==:#{pane_index},17},#a6e3a1,#{?#{==:#{pane_index},18},#fab387,#{?#{==:#{pane_index},19},#cba6f7,#{?#{==:#{pane_index},20},#f38ba8,#{?#{==:#{pane_index},21},#f9e2af,#{?#{==:#{pane_index},22},#89b4fa,#{?#{==:#{pane_index},23},#f5c2e7,#{?#{==:#{pane_index},24},#89dceb,#{?#{==:#{pane_index},25},#a6e3a1,#{?#{==:#{pane_index},26},#fab387,#{?#{==:#{pane_index},27},#cba6f7,#{?#{==:#{pane_index},28},#f38ba8,#{?#{==:#{pane_index},29},#f9e2af,#{?#{==:#{pane_index},30},#89b4fa,#{?#{==:#{pane_index},31},#f5c2e7,#89dceb}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}'
set -g pane-border-indicators off
set -g pane-border-lines single
set -g pane-border-format '#[none,fg=#{?#{==:#{pane_index},0},#89dceb,#{?#{==:#{pane_index},1},#a6e3a1,#{?#{==:#{pane_index},2},#fab387,#{?#{==:#{pane_index},3},#cba6f7,#{?#{==:#{pane_index},4},#f38ba8,#{?#{==:#{pane_index},5},#f9e2af,#{?#{==:#{pane_index},6},#89b4fa,#{?#{==:#{pane_index},7},#f5c2e7,#{?#{==:#{pane_index},8},#89dceb,#{?#{==:#{pane_index},9},#a6e3a1,#{?#{==:#{pane_index},10},#fab387,#{?#{==:#{pane_index},11},#cba6f7,#{?#{==:#{pane_index},12},#f38ba8,#{?#{==:#{pane_index},13},#f9e2af,#{?#{==:#{pane_index},14},#89b4fa,#{?#{==:#{pane_index},15},#f5c2e7,#{?#{==:#{pane_index},16},#89dceb,#{?#{==:#{pane_index},17},#a6e3a1,#{?#{==:#{pane_index},18},#fab387,#{?#{==:#{pane_index},19},#cba6f7,#{?#{==:#{pane_index},20},#f38ba8,#{?#{==:#{pane_index},21},#f9e2af,#{?#{==:#{pane_index},22},#89b4fa,#{?#{==:#{pane_index},23},#f5c2e7,#{?#{==:#{pane_index},24},#89dceb,#{?#{==:#{pane_index},25},#a6e3a1,#{?#{==:#{pane_index},26},#fab387,#{?#{==:#{pane_index},27},#cba6f7,#{?#{==:#{pane_index},28},#f38ba8,#{?#{==:#{pane_index},29},#f9e2af,#{?#{==:#{pane_index},30},#89b4fa,#{?#{==:#{pane_index},31},#f5c2e7,#89dceb}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}}},bg=default]#[fg=#{@thm_crust},bg=#{?#{==:#{pane_index},0},#89dceb,#{?#{==:#{pane_index},1},#a6e3a1,#{?#{==:#{pane_index},2},#fab387,#{?#{==:#{pane_index},3},#cba6f7,#{?#{==:#{pane_index},4},#f38ba8,#{?#{==:#{pane_index},5},#f9e2af,#{?#{==:#{pane_index},6},#89b4fa,#{?#{==:#{pane_index},7},#f5c2e7,#{?#{==:#{pane_index},8},#89dceb,#{?#{==:#{pane_index},9},#a6e3a1,#{?#{==:#{pane_index},10},#fab387,#{?#{==:#{pane_index},11},#cba6f7,#{?#{==:#{pane_index},12},#f38ba8,#{?#{==:#{pane_index},13},#f9e2af,#{?#{==:#{pane_index},14},#89b4fa,#{?#{==:#{pane_index},15},#f5c2e7,#{?#{==:#{pane_index},16},#89dceb,#{?#{==:#{pane_index},17},#a6e3a1,#{?#{==:#{pane_index},18},#fab387,#{?#{==:#{pane_index},19},#cba6f7,#{?#{==:#{pane_index},20},#f38ba8,#{?#{==:#{pane_index},21},#f9e2af,#{?#{==:#{pane_index},22},#89b4fa,#{?#{==:#{pane_index},23},#f5c2e7,#{?#{