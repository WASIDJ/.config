# ============================================
# 基础设置
# ============================================
set-option -g default-shell /bin/zsh
set-environment -g PATH "/Users/Admin/.bun/bin:/Users/Admin/.local/bin:/opt/homebrew/bin:/opt/homebrew/sbin:/Users/Admin/.npm-global/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
set-environment -g TPM_PLUGIN_PATH "$HOME/.config/tmux/plugins"
set-environment -g CODEX_USAGE_PROXY "http://127.0.0.1:7890"
# 默认让 Ghostty 处理 ⌘+click；需要鼠标选 pane / 拖动 / 滚动时按 Ctrl+q m。
set -g mouse off
# 开启后可尝试 ⌘+Shift+click；若无效，再按 Ctrl+q m 关闭。
bind m set -g mouse \; display-message "mouse: #{?mouse,on,off}"
set -g set-clipboard on
set -g mode-keys vi
set -g clock-mode-style 24
set -g history-limit 100000
set -s extended-keys on
set -g extended-keys-format csi-u
bind-key -n S-Enter send-keys -H 1b 5b 31 33 3b 32 75
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g allow-passthrough on
# 告诉 tmux 客户终端支持 OSC 8 超链接，保留 Cmd/Super + Click 跳转。
# 使用固定数组项代替 `set -as`，避免每次 source-file 都重复追加。
# 声明外层终端支持 OSC 52 剪贴板 + 超链接。
# 用 append 而不是固定下标，避免 source-file 时重复追加或覆盖。
set -ag terminal-features '*:clipboard'
set -ag terminal-features '*:hyperlinks'
# 前缀键
unbind C-b
set -g prefix C-q
bind C-q send-prefix

# ============================================
# Session 管理
# ============================================
# 创建新 session
bind C-c new-session
# ================================
# Session 列表、删除管理菜单
# ================================
# 弹出菜单（上下选择，Enter 切换，x 删除）
bind u choose-session
# Session 列表 (交互式输入选择)
# 使用 g 避免与 pane 分屏键 s/S 产生操作混淆
bind g command-prompt -p "switch to session:" "switch-client -t '%%'"
# 下一个 session
bind ) switch-client -n
# 上一个 session
bind ( switch-client -p
# 重命名 session
bind C-r command-prompt -p "rename session:" "rename-session '%%'"
# 快速切换到上一个活跃 session
bind b switch-client -l
# 关闭当前 session (不带确认)
bind Q kill-session

# Codex 周额度 / reset 菜单（Prefix + Ctrl-u）
bind C-u display-menu -T "#[align=centre]Codex 周额度" -x C -y C \
  "刷新周额度" r "run-shell 'lua \"$HOME/.config/tmux/scripts/codex-usage-status.lua\" update; tmux refresh-client -S; tmux display-message \"Codex 周额度已刷新\"'" \
  "CLI 查看 / 兑换 reset 券" u "display-popup -E -w 90% -h 80% -d '#{pane_current_path}' -T 'Codex Usage / Reset' '$HOME/.config/tmux/scripts/codex-usage-popup.exp'" \
  "" \
  "关闭" q ""

# ============================================
# Window 管理
# ============================================
# 新建 window (保持当前路径)
bind c new-window -c "#{pane_current_path}"
# Window 导航 (直接跳转)
bind 1 select-window -t :1
bind 2 select-window -t :2
bind 3 select-window -t :3
bind 4 select-window -t :4
bind 5 select-window -t :5
bind 6 select-window -t :6
bind 7 select-window -t :7
bind 8 select-window -t :8
bind 9 select-window -t :9

# 上/下一个 window（Alt+n/p，释放 Alt+b/f 给 shell）
unbind -n M-b
unbind -n M-Left
unbind -n M-Right
bind -n M-n next-window
bind -n M-p previous-window

# 重命名 window（Prefix + r 或 ,）
bind r command-prompt -p "rename window: " "rename-window '%%'"
bind , command-prompt -p "rename window: " "rename-window '%%'"
# 关闭当前 window (带确认)
bind X confirm-before -p "kill window #W? (y/n)" kill-window

# ============================================
# Pane 管理 (保留你的设置)
# ============================================
# 分屏 (mnemonic: v 竖/s 横)
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
# Alt + hjkl 切换 pane
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
# Alt + Shift + hjkl 调整 pane 大小 (支持重复按键)
bind -nr M-H resize-pane -L 5
bind -nr M-J resize-pane -D 5
bind -nr M-K resize-pane -U 5
bind -nr M-L resize-pane -R 5
# 关闭当前 pane (带确认)
bind x confirm-before -p "kill pane #P? (y/n)" kill-pane
# 最大化/还原 pane (zoom)
bind z resize-pane -Z

# ============================================
# 复制模式
# ============================================
# 进入复制模式
bind Enter copy-mode
# v 开始选择, y 复制
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
# ============================================
# 插件
# ============================================
# 先加载 catppuccin 主题（确保窗口名显示正确）
run '~/.config/tmux/plugins/catppuccin/catppuccin.tmux'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'        # 会话持久化
set -g @plugin 'tmux-plugins/tmux-continuum'         # 自动保存/恢复
set -g @plugin 'nhdaly/tmux-better-mouse-mode'       # 更好的鼠标支持
set -g @plugin 'wfxr/tmux-fzf-url'                   # Prefix + o 提取并打开屏幕中的 URL
set -g @plugin 'catppuccin/tmux'

# fzf-url 配置 (避免与 session 菜单 u 冲突，使用 Prefix + o)
set -g @fzf-url-bind 'o'

# resurrect 配置
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Catppuccin status modules
set -g status-left-length 100
set -g status-right-length 220
set -g status-left "#[fg=#{?client_prefix,#{E:@thm_red},#{E:@thm_green}}]#[fg=#{@thm_crust},bg=#{?client_prefix,#{E:@thm_red},#{E:@thm_green}}] #[fg=#{@thm_fg},bg=#{@thm_surface_0}] #S #[fg=#{@thm_surface_0},bg=default] "
set -g status-right "#[fg=#{@thm_pink},bg=default]#[fg=#{@thm_crust},bg=#{@thm_pink}] #[fg=#{@thm_fg},bg=#{@thm_surface_0}] #{pane_current_command} #[fg=#{@thm_mauve},bg=#{@thm_surface_0}]#[fg=#{@thm_crust},bg=#{@thm_mauve},bold] Codex #[fg=#{@thm_fg},bg=#{@thm_surface_0}] #(lua "$HOME/.config/tmux/scripts/codex-usage-status.lua" render) #[fg=#{@thm_lavender},bg=#{@thm_surface_0}]#[fg=#{@thm_crust},bg=#{@thm_lavender}]󰒋 #[fg=#{@thm_fg},bg=#{@thm_surface_0}] #H #[fg=#{@thm_sky},bg=#{@thm_surface_0}]#[fg=#{@thm_crust},bg=#{@thm_sky}]󰃰 #[fg=#{@thm_fg},bg=#{@thm_surface_0}] %H:%M #[fg=#{@thm_surface_0},bg=default]"
# 点击右侧 statusbar（含 Codex）打开周额度菜单。
bind -n MouseDown1StatusRight display-menu -T "#[align=centre]Codex 周额度" -x M -y W \
  "刷新周额度" r "run-shell 'lua \"$HOME/.config/tmux/scripts/codex-usage-status.lua\" update; tmux refresh-client -S; tmux display-message \"Codex 周额度已刷新\"'" \
  "CLI 查看 / 兑换 reset 券" u "display-popup -E -w 90% -h 80% -d '#{pane_current_path}' -T 'Codex Usage / Reset' '$HOME/.config/tmux/scripts/codex-usage-popup.exp'" \
  "" \
  "关闭" q ""
# End Catppuccin status modules

run '~/.config/tmux/plugins/tpm/tpm'

# ============================================
# 固定 Pane 别名（放在插件后，避免被主题覆盖）
# ============================================
set -g pane-border-status top
# Claude Code 风格：边框与加粗标题同色，无色块与装饰；英文大写，中文保留。
# 使用 tmux 原生 ASCII 替换，不改变别名原文、不启动外部进程。
